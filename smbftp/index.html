<!DOCTYPE html>
<!-- SPDX-License-Identifier: GPL-3.0-or-later - Copyright (C) 2026 cockpit_sharehub contributors -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>SMB + FTP Shares</title>
    <link rel="stylesheet" href="smbftp.css">
    <script src="../base1/cockpit.js"></script>
    <script src="smbftp.js" defer></script>
</head>
<body>
<main class="page">
    <header class="page-head">
        <div>
            <h1>SMB + FTP Shares</h1>
            <p class="muted">Samba registry shares, optionally published over FTP (ProFTPD) with the same users and groups.</p>
        </div>
        <div class="actions">
            <button class="btn btn-secondary" id="btn-settings" type="button">FTP settings</button>
            <button class="btn btn-primary" id="btn-add" type="button">Add share</button>
        </div>
    </header>

    <div id="alerts" class="alerts"></div>

    <section class="card">
        <div id="loading" class="empty">Loading…</div>
        <table class="tbl hidden" id="tbl">
            <thead>
                <tr>
                    <th scope="col">Name</th>
                    <th scope="col">Path</th>
                    <th scope="col">Access</th>
                    <th scope="col">SMB</th>
                    <th scope="col">FTP</th>
                    <th scope="col" class="col-actions"><span class="sr-only">Actions</span></th>
                </tr>
            </thead>
            <tbody id="rows"></tbody>
        </table>
        <div id="empty" class="empty hidden">
            <p>No shares in the Samba registry yet.</p>
            <button class="btn btn-primary" id="btn-add-empty" type="button">Add the first share</button>
        </div>
    </section>
</main>
<div id="modal-root"></div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
</body>
</html>
